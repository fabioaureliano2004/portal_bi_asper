  <script>

// FUNÇÃO QUE EXTRAI O NOME DO USUARIO LOGADO
let portalMode = 'corporate';

    function extractNameFromEmail(email) {
      const atIndex = email.indexOf('@');
      if (atIndex === -1) return email;
      const namePart = email.substring(0, atIndex);
      const cleanName = namePart.replace(/[^a-zA-ZÀ-ÿ._\s]/g, '');
      return cleanName.split(/[._\s]+/).map(word =>
        word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
      ).join(' ');
    }

    //MONTA A CHAVE DO LOCALSTORAGE DOS FAVORITOS
    function getFavoritesKey() {
      const userName = localStorage.getItem('userName');
      return userName ? `userFavorites_${userName}` : 'userFavorites';
    }

    // PREENCHE O CAMPO DE EMAIL COM O ULTIMO LOGIN SALVO
    function populateEmailFromStorage() {
      const lastEmail = localStorage.getItem('userEmail');
      if (lastEmail) {
        document.getElementById('username').value = lastEmail;
      }
    }

// FUNÇÃO QUE VALIDA O EMAIL, REGISTRA O LOGIN E DIRECIONA O USUARIO CONFORME A SELEÇÃO NO LOGIN
function logar_email(tipo) {
  const email = document.getElementById('username').value.trim();
    if (!email) {
      swal("Atenção", "Por favor, digite seu email", "warning");
        return;
        }
      if (!email.toLowerCase().endsWith('@asper.tec.br')) {
        swal("Email inválido", "Por favor, digite um email válido", "error");return;
          }
portalMode = tipo;
  const userName = extractNameFromEmail(email);
  localStorage.setItem('userEmail', email);
  localStorage.setItem('userName', userName);
  localStorage.setItem('isLoggedIn', 'true');
  localStorage.setItem('portalMode', tipo);
  document.body.classList.add("sem-fundo");
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('portal-screen').style.display = 'block';
  updateUserInterface(userName);
  loadUserFavorites();
  updateFavoriteStars();
  if (tipo === 'corporate') {
loadReport(
'Cadência de Vendas - Corporate',
'https://app.powerbi.com/reportEmbed?reportId=6f55fb9b-386d-4161-9738-5ba33c28e08c&autoAuth=true&ctid=33f70dd6-5ac0-4e74-a8c4-7736b9998de1'
);
} else if (tipo === 'strategic') {
loadReport(
'Cadência de Vendas - Strategic',
'https://app.powerbi.com/reportEmbed?reportId=ce20a78b-71d8-4e4f-9939-48aa368574f4&autoAuth=true&ctid=33f70dd6-5ac0-4e74-a8c4-7736b9998de1'
);
} else if (tipo === 'revops') {
loadReport(
'Cadência de Vendas - Sales Intelligence',
'https://app.powerbi.com/reportEmbed?reportId=71884cc2-59f1-4d0e-8652-163d35ea7dba&autoAuth=true&ctid=33f70dd6-5ac0-4e74-a8c4-7736b9998de1'
);
}
swal(
"Login realizado!",
`Bem-vindo, ${userName}!`,
"success"
);
}

// EXIBE O NOME DO USUARIO CONECTADO
    function updateUserInterface(userName) {
      document.getElementById('user-sidebar').textContent = userName;
    }

// FUNÇÃO DE LOGOUT - ENCERRA A SESSAO E LIMPA DADOS DE LOGIN
    function logout() {
      document.body.classList.remove("sem-fundo");
      const lastEmail = localStorage.getItem('userEmail') || '';
      localStorage.removeItem('userName');
      localStorage.removeItem('isLoggedIn');
      document.getElementById('portal-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('username').value = lastEmail;
    }

  // ADICIONA OU REMOVE DADOS DA LISTA DE FAVORITOS
    function toggleFavorite(event, element) {
      event.preventDefault();
      event.stopPropagation();

      const title = element.getAttribute('data-title');
      const url = element.getAttribute('data-url');
      const favorite = { title, url };

      let favorites = JSON.parse(localStorage.getItem(getFavoritesKey()) || '[]');
      const existingIndex = favorites.findIndex(fav => fav.url === url);

      if (existingIndex > -1) {
        favorites.splice(existingIndex, 1);
        element.classList.remove('favorited');
        swal("Removido!", `${title} foi removido dos favoritos`, "info");
      } else {
        favorites.push(favorite);
        element.classList.add('favorited');
        swal("Adicionado!", `${title} foi adicionado aos favoritos`, "success");
      }

      localStorage.setItem(getFavoritesKey(), JSON.stringify(favorites));
      loadUserFavorites();
    }

  // LÊ OS FAVORITOS DO USUARIO NO LOCAL STORAGE
    function loadUserFavorites() {
      const favorites = JSON.parse(localStorage.getItem(getFavoritesKey()) || '[]');
      const favoritesMenu = document.getElementById('favorites-menu');

      favoritesMenu.innerHTML = '';

      if (favorites.length === 0) {
        favoritesMenu.innerHTML = '<li class="nav-item"><span class="nav-link text-muted">Nenhum favorito</span></li>';
        return;
      }

      favorites.forEach(fav => {
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.innerHTML = `
          <a class="nav-link" href="#" onclick="loadReport('${fav.title.replace(/'/g,"\\'")}','${fav.url.replace(/'/g,"\\'")}',this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star-fill" viewBox="0 0 16 16" style="color: #ffc107;">
              <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
            </svg>
            ${fav.title}
          </a>
        `;
        favoritesMenu.appendChild(li);
      });

      updateFavoriteStars();
    }

  //ATUALIZA OS ICONES DE ESTRELA PARA APARECEREM MARACADOS COMO FAVORITO
    function updateFavoriteStars() {
      const favorites = JSON.parse(localStorage.getItem(getFavoritesKey()) || '[]');
      const favoriteUrls = favorites.map(fav => fav.url);

      document.querySelectorAll('.favorite-icon').forEach(icon => {
        const url = icon.getAttribute('data-url');
        if (favoriteUrls.includes(url)) {
          icon.classList.add('favorited');
        } else {
          icon.classList.remove('favorited');
        }
      });
    }

    document.getElementById('search-input').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase().trim();
      const searchResults = document.getElementById('search-results');
      const searchClear = document.getElementById('search-clear');

      searchClear.style.display = searchTerm ? 'block' : 'none';

      if (searchTerm.length < 2) {
        searchResults.style.display = 'none';
        return;
      }

      const allLinks = document.querySelectorAll('.nav-link');
      const results = [];

      allLinks.forEach(link => {
        const onclick = link.getAttribute('onclick') || '';
        if (!onclick.includes('loadReport')) return;
        const m = onclick.match(/loadReport\('([^']+)','([^']+)'/);
        if (!m) return;
        const title = (m[1] || '').toLowerCase();
        const url = m[2] || '';
        if (title.includes(searchTerm)) {
          results.push({
            title: link.textContent.trim(),
            url,
            element: link
          });
        }
      });

      displaySearchResults(results, searchResults);
    });

  // RENDERIZA OS RESULTADOS DE BUSCA DE RELATORIOS
    function displaySearchResults(results, container) {
      container.innerHTML = '';

      if (results.length === 0) {
        container.innerHTML = '<div class="search-result-item text-muted">Nenhum resultado encontrado</div>';
      } else {
        results.forEach(result => {
          const div = document.createElement('div');
          div.className = 'search-result-item';
          div.textContent = result.title;
          div.onclick = () => {
            loadReport(result.title, result.url, result.element);
            container.style.display = 'none';
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear').style.display = 'none';
          };
          container.appendChild(div);
        });
      }

      container.style.display = 'block';
    }

    document.getElementById('search-clear').addEventListener('click', function() {
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').style.display = 'none';
      this.style.display = 'none';
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-container')) {
        document.getElementById('search-results').style.display = 'none';
      }
    });

// GERA O HTML DE UMA PASTA(COM SEUS ITENS) A PARTIR DOS DADOS DE REPORT_BY_YEAR
function renderReportFolder(folder, yearSuffix) {
  const collapseId = `${folder.collapse_id}_${yearSuffix}`;
  const itemsHtml = folder.reports.map(r => {
    const escUrl = r.url.replace(/'/g, "\\'");
    const escTitle = r.title.replace(/'/g, "\\'");
    return `
      <li class="nav-item">
        <a class="nav-link" href="#" onclick="loadReport('${escTitle}','${escUrl}',this)">
          ${r.svg} ${r.title}
          <span class="favorite-icon" data-title="${r.data_title}" data-url="${r.url}" onclick="toggleFavorite(event,this)"></span>
        </a>
      </li>`;
  }).join('');

  return `
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" data-toggle="collapse" href="#${collapseId}" role="button" aria-expanded="false" aria-controls="${collapseId}">
          <span data-feather="folder"></span> ${folder.name}
        </a>
        <div class="collapse" id="${collapseId}">
          <ul class="nav flex-column ml-3">
            ${itemsHtml}
            <br>
          </ul>
        </div>
      </li>
    </ul>`;
}

//REBDERIZA TODAS AS PASTAS DO ANO SELECIONADO
function renderYearMenu(year) {
  const container = document.getElementById('year-reports-container');
  if (!container) return;

  const folders = REPORTS_BY_YEAR[year] || [];
  container.innerHTML = folders.map(f => renderReportFolder(f, year)).join('');

  feather.replace();
  updateFavoriteStars();
}

//ALTERNA A ABA DE ANO ATIVA
function selectReportYear(year, btn) {
  document.querySelectorAll('.year-tab').forEach(tab => {
    tab.classList.remove('active');
    tab.setAttribute('aria-selected', 'false');
  });
  if (btn) {
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
  }
  renderYearMenu(year);
}

document.addEventListener('DOMContentLoaded', function() {
  populateEmailFromStorage();
  feather.replace();
  updateFavoriteStars();
  loadUserFavorites();
  renderYearMenu('2026');
});

// ============================================
// LOAD REPORT
// ============================================

//CARREGA O RELATORIO DO IFRAME OU ABRE O CRM EXTERNAMENTE
function loadReport(title, url, element) {
    if (!url) return;
    if (title === 'CRM') {
        window.open(
            'https://app.hubspot.com/contacts/50100454/objects/0-3/views/all/list',
            '_blank',
            'noopener,noreferrer'
        );
        return;
    }
    const iframe = document.getElementById('powerbi-frame');
    if (!iframe) {
        console.error('powerbi-frame não encontrado.');
        return;
    }

//EXIBE O SPINNER ENQUANTO O POWER BI É CARREGADO
    showReportLoading();
    iframe.src = url;
    const reportTitle = document.getElementById('report-title');
    if (reportTitle) {
        reportTitle.textContent = title;
    }
    document.querySelectorAll('.nav-link').forEach(link => {
        const onclick = link.getAttribute('onclick') || '';
        if (onclick.includes('loadReport')) {
            link.classList.remove('active');
            link.removeAttribute('aria-current');
        }
    });
    if (element) {
        element.classList.add('active');
        element.setAttribute('aria-current', 'page');
    }
    if (window.innerWidth < 768) {
        toggleSidebar(false);
    }
}

function showReportLoading() {
    const loading = document.getElementById('report-loading');
    if (loading) loading.classList.remove('hidden');
}

// ESCONDE O SPINNER QUANDO O RELATORIO POWER BI TERMINA DE CERREGAR
function hideReportLoading() {
    const loading = document.getElementById('report-loading');
    if (loading) loading.classList.add('hidden');
}

//ABRE E FECHA O MENU LATERAL EM MODO MOBILE
function toggleSidebar(forceState) {
    const sidebar = document.getElementById('main-sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    const toggleBtn = document.getElementById('sidebar-toggle');
    if (!sidebar) return;

    const shouldOpen = typeof forceState === 'boolean' ? forceState : !sidebar.classList.contains('open');

    sidebar.classList.toggle('open', shouldOpen);
    if (backdrop) backdrop.classList.toggle('open', shouldOpen);
    if (toggleBtn) toggleBtn.setAttribute('aria-expanded', String(shouldOpen));
}
